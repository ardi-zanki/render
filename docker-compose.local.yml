# Local test stack — run the production Docker image on your machine.
# Postgres + mock AI/payment + local storage. Production-mode email still
# needs Resend credentials for sign-up; use pnpm dev for console-only email.
#   cp .env.example .env.docker   # generate two secrets; see DEPLOYMENT.md
#
#   docker compose -f docker-compose.local.yml build
#   docker compose -f docker-compose.local.yml up -d db
#   docker compose -f docker-compose.local.yml run --rm web pnpm db:migrate
#   docker compose -f docker-compose.local.yml run --rm web pnpm db:seed
#   docker compose -f docker-compose.local.yml up -d
#   open http://localhost:3000
name: renderai-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renderai
      POSTGRES_PASSWORD: renderai
      POSTGRES_DB: renderai
    ports:
      - "5433:5432" # host 5433 so it won't clash with your local Postgres on 5432
    volumes:
      - renderai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderai -d renderai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        APP_URL: http://localhost:3000
    image: renderai-local:latest
    env_file:
      - path: .env.docker
        required: false # allows starting only db before creating the app env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://renderai:renderai@db:5432/renderai
      AI_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      RENDER_PROCESSING_MODE: worker
    ports:
      - "3000:3000"
    volumes:
      - renderai_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: renderai-local:latest
    command: pnpm worker
    env_file:
      - path: .env.docker
        required: false # allows starting only db before creating the app env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://renderai:renderai@db:5432/renderai
      AI_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      RENDER_PROCESSING_MODE: worker
    volumes:
      - renderai_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  renderai_pgdata:
  renderai_uploads:
