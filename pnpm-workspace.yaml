allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
overrides:
  # @better-auth/kysely-adapter 1.6.x imports DEFAULT_MIGRATION_TABLE which
  # kysely 0.29.x dropped; pin to 0.28.x (still within Better Auth's range).
  kysely: 0.28.17
