name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: renderai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renderai_test
  APP_URL: http://localhost:3210
  BETTER_AUTH_URL: http://localhost:3210
  BETTER_AUTH_SECRET: ci-better-auth-secret-please-keep-long
  JWT_SECRET: ci-jwt-secret-please-keep-long
  JWT_ISSUER: renderai
  JWT_AUDIENCE: renderai-app
  RATE_LIMIT_DRIVER: database
  RATE_LIMIT_ENABLED: "false"
  STORAGE_PROVIDER: local
  EMAIL_PROVIDER: resend
  PAYMENT_PROVIDER: mock
  AI_PROVIDER: mock

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: renderai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d renderai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Check design system
        run: pnpm check:design-system

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
      WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}

    steps:
      - name: Validate deploy hooks
        run: |
          if { [ -n "$WEB_HOOK" ] && [ -z "$WORKER_HOOK" ]; } ||              { [ -z "$WEB_HOOK" ] && [ -n "$WORKER_HOOK" ]; }; then
            echo "Configure both Render deploy hooks or leave both empty."
            exit 1
          fi

      - name: Trigger deploy hooks
        if: env.WEB_HOOK != '' && env.WORKER_HOOK != ''
        run: |
          curl -fsS -X POST "$WEB_HOOK"
          curl -fsS -X POST "$WORKER_HOOK"

      - name: Skip deployment
        if: env.WEB_HOOK == '' && env.WORKER_HOOK == ''
        run: echo "Deploy hooks are not configured. Render auto-deploy may be used instead."