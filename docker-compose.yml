# VPS: use --env-file .env.production for Compose interpolation as well as
# container env. See DEPLOYMENT.md for build, migration and startup commands.
# PostgreSQL is external; this stack does not create a database service.
name: renderai

services:
  web:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?set APP_URL to your public HTTPS origin}
    image: renderai:latest
    env_file: .env.production
    environment:
      PORT: "3000"
      NODE_ENV: production
      RENDER_PROCESSING_MODE: worker
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    image: renderai:latest
    command: pnpm worker
    env_file: .env.production
    environment:
      NODE_ENV: production
      RENDER_PROCESSING_MODE: worker
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your production hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
