# Render.com Blueprint — RenderAI (same Docker image as the VPS path).
# PostgreSQL is external (for example Neon). Set DATABASE_URL in the secrets
# group. The worker is mandatory:
# without it, render jobs stay "queued".
#
# Before creating the Blueprint, create the renderai-secrets environment group
# in the Dashboard and populate it as described in DEPLOYMENT.md. Shared secrets
# must be identical for web and worker. sync:false is not supported in groups.

envVarGroups:
  - name: renderai-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_DRIVER
        value: database
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: STORAGE_PROVIDER
        value: r2
      - key: EMAIL_PROVIDER
        value: resend
      - key: PAYMENT_PROVIDER
        value: midtrans
      - key: AI_PROVIDER
        value: fal
      - key: RENDER_PROCESSING_MODE
        value: worker
      - key: JOB_LOCK_TIMEOUT_SECONDS
        value: "300"
      - key: FAL_RENDER_MODEL
        value: fal-ai/flux-2-pro/edit
      - key: FAL_STYLE_TRANSFER_MODEL
        value: fal-ai/uso
      - key: FAL_UPSCALE_MODEL
        value: fal-ai/aura-sr
      - key: FAL_START_TIMEOUT_SECONDS
        value: "300"
      - key: JWT_ISSUER
        value: renderai
      - key: JWT_AUDIENCE
        value: renderai-app
      - key: SESSION_REMEMBER_ME_MAX_AGE
        value: "2592000"
      - key: ADMIN_SESSION_MAX_AGE
        value: "43200"
      - key: SENSITIVE_ACTION_MAX_AGE
        value: "900"
      - key: SUPPORT_EMAIL
        value: support@renderai.id
      - key: MIDTRANS_IS_PRODUCTION
        value: "true"

services:
  - type: web
    name: renderai-web
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: renderai-shared
      - fromGroup: renderai-secrets

  - type: worker
    name: renderai-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: pnpm worker
    autoDeploy: true
    envVars:
      - fromGroup: renderai-shared
      - fromGroup: renderai-secrets
